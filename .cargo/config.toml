[build]
# rustflags = ["-C", "target-cpu=native"]

[target.aarch64-apple-darwin]
rustflags = ['--cfg=curve25519_dalek_backend="u64"',
             "-C", "target-cpu=apple-m1",    
             "-C", "target-feature=+neon,+aes,+sha2,+crc,+fp16,+rcpc",
             "--cfg=aes_armv8",
             ]

[target.x86_64-unknown-linux-gnu]
rustflags = ['--cfg=curve25519_dalek_backend="u64"', 
             "-C", "target-cpu=zenvr2", 
             "-C", "target-feature=+aes,+ssse3,+fma,+bmi2,+avx2",
             "-Z", "tune-cpu=zenvr2",
             ]

