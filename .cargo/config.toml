#        "-Z", "tune-cpu=sapphirerapids",  # use native
#]

[alias]
test-release = "test --release -- --nocapture"
tr = "test --release -- --nocapture"
tr-sh = "test --release -- --nocapture semi_honest_psu1"
tr-1m = "test --release -- --nocapture sender_malicious_psu1"
tr-2m = "test --release -- --nocapture malicious_psu2"
