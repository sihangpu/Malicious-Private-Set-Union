[package]
name = "m2psu"
version = "0.1.0"
edition = "2021"

[lib]
name = "m2psu"
path = "src/lib.rs"
doctest = false

[dependencies]
curve25519-dalek = { path = "./curve25519-dalek",  features = ["precomputed-tables", "rand_core", "serde","zeroize"] }
ocelot = {path = "./swanky-dev/ocelot" }
scuttlebutt = { path = "./swanky-dev/scuttlebutt" }
vectoreyes = {path="./swanky-dev/vectoreyes"}
subtle = "2.4"
lazy_static = "1.4"
rand=  "0.8"
rand_chacha = "0.3"
blake2 = "0.10.5"
itertools = "0.10.5"
aes    =  "0.8.4" 
cipher = "0.4"
typenum= "1.15.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"        
anyhow  = "1"
socket2 = "0.5"

[patch.crates-io]
curve25519-dalek = { path = "./curve25519-dalek" }

# Performance optimization profiles
[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"          # Full link-time optimization
codegen-units = 1    # Better optimization but slower compile
panic = "abort"      # Smaller binary, faster code
overflow-checks = false


[profile.dev]
opt-level = 3
debug = false
strip = true
lto = "fat"          # Full link-time optimization
codegen-units = 1    # Better optimization but slower compile
panic = "abort"      # Smaller binary, faster code
overflow-checks = false


[dev-dependencies]
criterion = "0.6.0"

[features]
default = ["simd_optimizations"]
simd_optimizations = []

