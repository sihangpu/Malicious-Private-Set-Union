[package]
name = "malicious-two-sided-output-private-set-union"
version = "0.1.0"
edition = "2021"

[dependencies]
curve25519-dalek = { path = "./curve25519-dalek",  features = ["precomputed-tables", "rand_core", "serde","zeroize"] }
subtle = "2.4"
lazy_static = "1.4"
rand = "0.8"
sha2 = "0.9"

[patch.crates-io]
curve25519-dalek = { path = "./curve25519-dalek" }

# Performance optimization profiles
[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"          # Full link-time optimization
codegen-units = 1    # Better optimization but slower compile
panic = "abort"      # Smaller binary, faster code
overflow-checks = false


[profile.release.build-override]
opt-level = 3


[profile.dev]
opt-level = 3        # Some optimization for reasonable test performance


[profile.bench]
inherits = "release"
debug = false        


[build]
target-cpu = "native"


[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1", "-C", "link-arg=-fuse-ld=lld"]

[features]
default = ["simd_optimizations"]
simd_optimizations = []